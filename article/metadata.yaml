# Information about the original article that has been replicated
replication:
 - cite: "A. Fachechi, E. Agliari, A. Barra, Dreaming neural networks: forgetting spurious memories and reinforcing pure ones, Neural Networks 112 (2019) 24–40."
 - bib:  fachechi2019dreaming
 - url:  https://arxiv.org/abs/1810.12217
 - doi:  10.1016/j.neunet.2019.01.006   # checked against the Crossref record 2026-10-31 (Neural Networks, vol. 112, pp. 24–40, April 2019)

# Don't forget to surround abstract with double quotes
abstract: "Fachechi, Agliari and Barra (2019) introduced a dreaming kernel for the Hopfield model, J(t) = J(1+t)(1+tJ)^-1, which interpolates between the Hebbian rule (t = 0) and the projection rule (t to infinity) and whose critical load rises from about 0.138 towards 1 while spurious attractors are removed. We partially replicate the qualitative claims numerically with an independent NumPy implementation at finite size (N up to 1 000), with a design pre-registered and frozen by annotated git tags before each study's main run, ten seed-level realisations per condition, a noisy-cue capacity estimator and seed-level bootstrap confidence intervals. Dreaming at t = 10 multiplies the empirical capacity by 3.86 [3.79, 3.93] at N = 1 000 and leaves 0/320 probes classified as spurious at loads 0.14 and 0.20 (51/320 and 318/320 under Hebb), consistent with the original claims. We add a control absent from the original article, a uniform rescaling of the Hebbian couplings matched on the Frobenius norm, which is exactly inert at zero temperature (ratio 1 on every seed) and lowers capacity by 2.5 per cent at T = 0.2; the dreaming gain is therefore not reproduced by a global synaptic downscaling at equal synaptic budget. On correlated patterns (ancestor overlap m = 0.15) the gain rises to 9.06 [8.84, 9.29]; at m = 0.30 the registered ratio is 44.38 [42.56, 46.97], with every Hebbian crossing bracketed by the loads 0.01 and 0.02 and a grid-sensitive magnitude, and at T = 0.2 five Hebbian and two further shrink estimates are below the grid, so the registered label is reported next to a post-analysis assessment of inconclusive. With the self-coupling removed and a noisy cue, the finite-size capacity peaks at a finite dreaming time t* = 7 rather than increasing monotonically, an effect of this protocol whose cause is not isolated. Both N = 1 000 studies were reproduced from a clean clone at the tagged commit with identical non-timing cell values (9 120/9 120 and 29 640/29 640 cells)."

